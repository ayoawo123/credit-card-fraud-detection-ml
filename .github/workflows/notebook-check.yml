name: Notebook structure check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install nbformat
      - run: python -c "import nbformat; n=nbformat.read('notebooks/fraud_detection_analysis.ipynb', as_version=4); nbformat.validate(n); print('Notebook valid')"
