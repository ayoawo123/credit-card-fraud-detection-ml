<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="How rare is credit card fraud?"><rect width="800" height="360" fill="#ffffff"/><text x="28" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18212b">How rare is credit card fraud?</text><text x="28" y="70" font-family="Arial,sans-serif" fill="#253443" font-size="15" >Original dataset: 284,807 transactions</text><text x="28" y="128" font-family="Arial,sans-serif" fill="#253443" font-size="15" >Legitimate: 284,315 (99.827%)</text><rect x="270" y="105" width="490" height="35" rx="5" fill="#316fac"/><text x="28" y="213" font-family="Arial,sans-serif" fill="#253443" font-size="15" >Fraud: 492 (0.173%)</text><rect x="270" y="188" width="490" height="35" rx="5" fill="#e6ebef"/><rect x="270" y="188" width="3" height="35" rx="0" fill="#e5a33f"/><text x="28" y="295" font-family="Arial,sans-serif" fill="#253443" font-size="15" >A majority-class classifier can be 99.83% accurate while catching zero fraud.</text></svg>